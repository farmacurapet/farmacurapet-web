<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Farmacura Pet | Oficial</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root { 
            --brand: #00d2ff; 
            --brand-dark: #3a7bd5; 
            --bg-glass: rgba(255, 255, 255, 0.9); 
            --text-main: #1e272e;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; 
            background: url('https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?q=80&w=2069&auto=format&fit=crop') center/cover fixed; 
            color: var(--text-main);
            min-height: 100vh;
        }

        .blur-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.3); backdrop-filter: blur(10px); z-index: -1; 
        }

        header { padding: 40px 20px; text-align: center; color: white; }
        header h1 { font-size: 2.2rem; font-weight: 800; margin: 0; text-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        .main-content { max-width: 480px; margin: 0 auto 120px auto; padding: 0 20px; }

        .glass-card { 
            background: var(--bg-glass); 
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 32px; 
            padding: 30px; 
            margin-bottom: 25px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.15); 
        }

        input, textarea { 
            width: 100%; padding: 16px; margin: 10px 0; 
            border: 2px solid #edf2f7; border-radius: 18px; 
            box-sizing: border-box; font-family: inherit; font-size: 1rem;
        }

        .btn-action { 
            background: linear-gradient(135deg, var(--brand), var(--brand-dark)); 
            color: white; border: none; padding: 18px; border-radius: 18px; 
            font-weight: 800; cursor: pointer; width: 100%; 
            text-transform: uppercase; letter-spacing: 1px; transition: 0.3s;
        }

        .nav-dock { 
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
            background: #1e272e; padding: 15px 35px; border-radius: 100px; 
            display: flex; gap: 30px; z-index: 1000; box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .nav-dock i { color: white; font-size: 1.5rem; cursor: pointer; opacity: 0.4; }
        .nav-dock i.active { opacity: 1; color: var(--brand); }

        .med-card { 
            background: white; border-radius: 20px; padding: 20px; margin-bottom: 15px;
            border-left: 6px solid var(--brand);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="blur-overlay"></div>
    
    <header>
        <h1>Farma<span style="color:var(--brand)">cura</span> Pet</h1>
        <p>Inspirado pela Lara 🐾</p>
    </header>

    <main class="main-content">
        <!-- LOGIN -->
        <section id="section-auth" class="glass-card">
            <h3 id="auth-title">Entrar</h3>
            <input type="email" id="email" placeholder="E-mail">
            <input type="password" id="password" placeholder="Senha">
            
            <div id="campos-cadastro" class="hidden">
                <input type="text" id="reg-nome" placeholder="Seu Nome">
            </div>

            <button class="btn-action" onclick="handleAuth()">Confirmar</button>
            <p onclick="toggleModo()" style="text-align:center; font-size:0.9rem; cursor:pointer; margin-top:20px;">
                Não tem conta? <b>Cadastre-se</b>
            </p>
        </section>

        <!-- MURAL -->
        <section id="section-app" class="hidden">
            <div class="glass-card">
                <input type="text" id="search" placeholder="🔍 Buscar remédio ou bairro..." onkeyup="carregarMural()">
                <div id="mural" style="margin-top: 20px;"></div>
            </div>
        </section>

        <!-- DOAR -->
        <section id="section-doar" class="hidden">
            <div class="glass-card">
                <h3>Nova Doação</h3>
                <input type="text" id="med-nome" placeholder="Nome do Medicamento">
                <input type="text" id="med-bairro" placeholder="Bairro (Recife)">
                <textarea id="med-desc" rows="3" placeholder="Detalhes e validade..."></textarea>
                <button class="btn-action" onclick="salvarDoacao()">Publicar Doação</button>
            </div>
        </section>
    </main>

    <nav class="nav-dock hidden" id="main-nav">
        <i class="fas fa-home active" onclick="irPara('section-app', this)"></i>
        <i class="fas fa-plus-circle" onclick="irPara('section-doar', this)"></i>
        <i class="fas fa-power-off" onclick="logout()"></i>
    </nav>

    <script>
        // CONFIGURAÇÃO SUPABASE
        const SUPABASE_URL = 'SUA_URL_DO_SUPABASE'; // <-- COLOQUE SUA URL AQUI
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrdXBmb3diZ3lrampka3dmaXlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzNjY1OTgsImV4cCI6MjA5MTk0MjU5OH0.yXCbccFrPB9qyVamthjAUdyrK0bqWfbRCG3LR4VAjBY';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function irPara(id, el) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('.nav-dock i').forEach(i => i.classList.remove('active'));
            if(el) el.classList.add('active');
            if(id === 'section-app') carregarMural();
        }

        function toggleModo() {
            const c = document.getElementById('campos-cadastro');
            c.classList.toggle('hidden');
            document.getElementById('auth-title').innerText = c.classList.contains('hidden') ? "Entrar" : "Criar Conta";
        }

        async function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const isCadastro = !document.getElementById('campos-cadastro').classList.contains('hidden');

            if(isCadastro) {
                const { error } = await supabase.auth.signUp({ email, password });
                if(error) Swal.fire('Erro', error.message, 'error');
                else Swal.fire('Sucesso', 'Verifique seu e-mail!', 'success');
            } else {
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if(error) Swal.fire('Erro', 'Acesso Negado', 'error');
            }
        }

        async function carregarMural() {
            const busca = document.getElementById('search').value;
            let query = supabase.from('medicamentos').select('*').order('created_at', { ascending: false });
            if(busca) query = query.ilike('nome', `%${busca}%`);

            const { data, error } = await query;
            const mural = document.getElementById('mural');
            
            if(error) { mural.innerHTML = "Erro ao carregar dados."; return; }

            mural.innerHTML = data.length ? data.map(m => `
                <div class="med-card">
                    <strong>${m.nome}</strong><br>
                    <small><i class="fas fa-map-marker-alt"></i> ${m.bairro}</small>
                    <p style="font-size:0.9rem;">${m.descricao}</p>
                    <button class="btn-action" style="padding:8px; font-size:0.7rem;" onclick="Swal.fire('Interesse','Fale com o doador via chat','info')">Tenho Interesse</button>
                </div>
            `).join('') : '<p>Nenhum item disponível.</p>';
        }

        async function salvarDoacao() {
            const nome = document.getElementById('med-nome').value;
            const bairro = document.getElementById('med-bairro').value;
            const descricao = document.getElementById('med-desc').value;

            if(!nome || !bairro) return Swal.fire('Ops','Preencha os campos obrigatórios','warning');

            const { error } = await supabase.from('medicamentos').insert([{ nome, bairro, descricao }]);
            if(!error) {
                Swal.fire('Parabéns!', 'Doação publicada com sucesso.', 'success');
                irPara('section-app');
            }
        }

        async function logout() { await supabase.auth.signOut(); }

        supabase.auth.onAuthStateChange((event, session) => {
            const nav = document.getElementById('main-nav');
            if (session) {
                nav.classList.remove('hidden');
                irPara('section-app');
            } else {
                nav.classList.add('hidden');
                irPara('section-auth');
            }
        });
    </script>
</body>
</html>
