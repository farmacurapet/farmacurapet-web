<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Farmacura Pet | Oficial</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root { 
            --brand: #00d2ff; 
            --brand-dark: #3a7bd5; 
            --bg-glass: rgba(255, 255, 255, 0.9); 
            --text-main: #1e272e;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; 
            background: url('https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?q=80&w=2069&auto=format&fit=crop') center/cover fixed; 
            color: var(--text-main);
            min-height: 100vh;
        }

        .blur-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.3); backdrop-filter: blur(10px); z-index: -1; 
        }

        header { padding: 40px 20px; text-align: center; color: white; }
        header h1 { font-size: 2.2rem; font-weight: 800; margin: 0; text-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        .main-content { max-width: 480px; margin: 0 auto 120px auto; padding: 0 20px; }

        .glass-card { 
            background: var(--bg-glass); 
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 32px; 
            padding: 30px; 
            margin-bottom: 25px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.15); 
        }

        .input-group { position: relative; width: 100%; }

        input, textarea { 
            width: 100%; padding: 16px; margin: 10px 0; 
            border: 2px solid #edf2f7; border-radius: 18px; 
            box-sizing: border-box; font-family: inherit; font-size: 1rem;
        }

        /* Estilo para o ícone do olhinho */
        .toggle-password {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            cursor: pointer; color: #a4b0be; z-index: 10;
        }

        .btn-action { 
            background: linear-gradient(135deg, var(--brand), var(--brand-dark)); 
            color: white; border: none; padding: 18px; border-radius: 18px; 
            font-weight: 800; cursor: pointer; width: 100%; 
            text-transform: uppercase; letter-spacing: 1px; transition: 0.3s;
            margin-top: 10px;
        }

        .nav-dock { 
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
            background: #1e272e; padding: 15px 35px; border-radius: 100px; 
            display: flex; gap: 30px; z-index: 1000; box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .nav-dock i { color: white; font-size: 1.5rem; cursor: pointer; opacity: 0.4; }
        .nav-dock i.active { opacity: 1; color: var(--brand); }

        .med-card { 
            background: white; border-radius: 20px; padding: 20px; margin-bottom: 15px;
            border-left: 6px solid var(--brand);
        }

        .link-footer {
            text-align: center; font-size: 0.85rem; cursor: pointer; margin-top: 15px; color: var(--brand-dark);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="blur-overlay"></div>
    
    <header>
        <h1>Farma<span style="color:var(--brand)">cura</span> Pet</h1>
        <p>Inspirado pela Lara 🐾</p>
    </header>

    <main class="main-content">
        <!-- LOGIN / CADASTRO -->
        <section id="section-auth" class="glass-card">
            <h3 id="auth-title">Entrar</h3>
            <input type="email" id="email" placeholder="E-mail">
            
            <div class="input-group">
                <input type="password" id="password" placeholder="Senha">
                <i class="fas fa-eye toggle-password" id="eye-icon" onclick="toggleSenha()"></i>
            </div>
            
            <div id="campos-cadastro" class="hidden">
                <input type="text" id="reg-nome" placeholder="Seu Nome Completo">
            </div>

            <button class="btn-action" onclick="handleAuth()">Confirmar</button>
            
            <p id="btn-forgot" class="link-footer" onclick="esqueciSenha()">Esqueci minha senha</p>
            <p onclick="toggleModo()" class="link-footer" id="toggle-text">
                Não tem conta? <b>Cadastre-se</b>
            </p>
        </section>

        <!-- MURAL -->
        <section id="section-app" class="hidden">
            <div class="glass-card">
                <input type="text" id="search" placeholder="🔍 Buscar remédio ou bairro..." onkeyup="carregarMural()">
                <div id="mural" style="margin-top: 20px;"></div>
            </div>
        </section>

        <!-- DOAR -->
        <section id="section-doar" class="hidden">
            <div class="glass-card">
                <h3>Nova Doação</h3>
                <input type="text" id="med-nome" placeholder="Nome do Medicamento">
                <input type="text" id="med-bairro" placeholder="Bairro (Recife)">
                <textarea id="med-desc" rows="3" placeholder="Detalhes e validade..."></textarea>
                <button class="btn-action" onclick="salvarDoacao()">Publicar Doação</button>
            </div>
        </section>

        <!-- PERFIL / ATUALIZAR -->
        <section id="section-perfil" class="hidden">
            <div class="glass-card">
                <h3>Meu Perfil</h3>
                <label><small>Nome de exibição:</small></label>
                <input type="text" id="perfil-nome" placeholder="Seu nome">
                <button class="btn-action" onclick="atualizarCadastro()">Atualizar Dados</button>
            </div>
        </section>
    </main>

    <nav class="nav-dock hidden" id="main-nav">
        <i class="fas fa-home active" onclick="irPara('section-app', this)"></i>
        <i class="fas fa-plus-circle" onclick="irPara('section-doar', this)"></i>
        <i class="fas fa-user-circle" onclick="irPara('section-perfil', this)"></i>
        <i class="fas fa-power-off" onclick="logout()"></i>
    </nav>

    <script>
        // CONFIGURAÇÃO SUPABASE
        const SUPABASE_URL = 'https://tkupfowbgykjjdkwfiyr.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrdXBmb3diZ3lrampka3dmaXlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzNjY1OTgsImV4cCI6MjA5MTk0MjU5OH0.yXCbccFrPB9qyVamthjAUdyrK0bqWfbRCG3LR4VAjBY';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 1. FUNÇÃO OLHINHO
        function toggleSenha() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // 2. FUNÇÃO ESQUECI SENHA
        async function esqueciSenha() {
            const email = document.getElementById('email').value;
            if(!email) return Swal.fire('Atenção', 'Digite seu e-mail para recuperar a senha.', 'info');

            const { error } = await supabase.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.href,
            });

            if(error) Swal.fire('Erro', error.message, 'error');
            else Swal.fire('Sucesso', 'Link de recuperação enviado para o e-mail!', 'success');
        }

        // 3. FUNÇÃO ATUALIZAR CADASTRO
        async function atualizarCadastro() {
            const nome = document.getElementById('perfil-nome').value;
            if(!nome) return Swal.fire('Erro', 'O nome não pode estar vazio.', 'warning');

            const { data, error } = await supabase.auth.updateUser({
                data: { full_name: nome }
            });

            if(error) Swal.fire('Erro', error.message, 'error');
            else Swal.fire('Sucesso', 'Perfil atualizado!', 'success');
        }

        // NAVEGAÇÃO
        function irPara(id, el) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('.nav-dock i').forEach(i => i.classList.remove('active'));
            if(el) el.classList.add('active');
            if(id === 'section-app') carregarMural();
        }

        function toggleModo() {
            const c = document.getElementById('campos-cadastro');
            const forgot = document.getElementById('btn-forgot');
            c.classList.toggle('hidden');
            
            if(c.classList.contains('hidden')) {
                document.getElementById('auth-title').innerText = "Entrar";
                document.getElementById('toggle-text').innerHTML = "Não tem conta? <b>Cadastre-se</b>";
                forgot.classList.remove('hidden');
            } else {
                document.getElementById('auth-title').innerText = "Criar Conta";
                document.getElementById('toggle-text').innerHTML = "Já tem conta? <b>Faça Login</b>";
                forgot.classList.add('hidden');
            }
        }

        async function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const nome = document.getElementById('reg-nome').value;
            const isCadastro = !document.getElementById('campos-cadastro').classList.contains('hidden');

            if(isCadastro) {
                const { error } = await supabase.auth.signUp({ 
                    email, 
                    password,
                    options: { data: { full_name: nome } }
                });
                if(error) Swal.fire('Erro', error.message, 'error');
                else Swal.fire('Sucesso', 'Conta criada! Verifique seu e-mail.', 'success');
            } else {
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if(error) Swal.fire('Erro', 'E-mail ou senha incorretos.', 'error');
            }
        }

        async function carregarMural() {
            const busca = document.getElementById('search').value;
            let query = supabase.from('medicamentos').select('*').order('created_at', { ascending: false });
            if(busca) query = query.ilike('nome', `%${busca}%`);

            const { data, error } = await query;
            const mural = document.getElementById('mural');
            if(error) { mural.innerHTML = "Erro ao carregar dados."; return; }

            mural.innerHTML = data.length ? data.map(m => `
                <div class="med-card">
                    <strong>${m.nome}</strong><br>
                    <small><i class="fas fa-map-marker-alt"></i> ${m.bairro}</small>
                    <p style="font-size:0.9rem;">${m.descricao}</p>
                    <button class="btn-action" style="padding:8px; font-size:0.7rem;" onclick="Swal.fire('Interesse','Contate o doador','info')">Tenho Interesse</button>
                </div>
            `).join('') : '<p>Nenhum item disponível.</p>';
        }

        async function salvarDoacao() {
            const nome = document.getElementById('med-nome').value;
            const bairro = document.getElementById('med-bairro').value;
            const descricao = document.getElementById('med-desc').value;

            if(!nome || !bairro) return Swal.fire('Ops','Preencha os campos obrigatórios','warning');

            const { error } = await supabase.from('medicamentos').insert([{ nome, bairro, descricao }]);
            if(!error) {
                Swal.fire('Parabéns!', 'Doação publicada com sucesso.', 'success');
                document.getElementById('med-nome').value = '';
                document.getElementById('med-bairro').value = '';
                document.getElementById('med-desc').value = '';
                irPara('section-app');
            }
        }

        async function logout() { await supabase.auth.signOut(); }

        supabase.auth.onAuthStateChange((event, session) => {
            const nav = document.getElementById('main-nav');
            if (session) {
                nav.classList.remove('hidden');
                document.getElementById('perfil-nome').value = session.user.user_metadata.full_name || '';
                irPara('section-app');
            } else {
                nav.classList.add('hidden');
                irPara('section-auth');
            }
        });
    </script>
</body>
                    </html>
