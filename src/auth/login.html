<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Lara Pet</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .login-card h2 { color: #2c3e50; margin-bottom: 1.5rem; }
        .input-group { margin-bottom: 1rem; text-align: left; }
        .input-group label { display: block; margin-bottom: 0.5rem; color: #666; }
        .input-group input { width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 1rem; background-color: #27ae60; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; transition: background 0.3s; }
        .btn-login:hover { background-color: #219150; }
        .footer-links { margin-top: 1.5rem; font-size: 0.9rem; color: #888; }
        .footer-links a { color: #27ae60; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="../public/assets/logo.png" alt="Lara Pet" style="width: 80px; margin-bottom: 1rem;">
        <h2>Acessar Farmacura</h2>
        <form id="loginForm">
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">Entrar</button>
        </form>
        <div class="footer-links">
            Não tem conta? <a href="register.html">Criar cadastro solidário</a>
        </div>
    </div>
    <script type="module" src="../js/auth.js"></script>
</body>
</html>
