<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel | Lara Pet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f0f2f5; display: flex; min-height: 100vh; }
        
        /* Menu Lateral */
        nav { width: 250px; background: #2c3e50; color: white; padding: 1.5rem; }
        nav h1 { font-size: 1.5rem; margin-bottom: 2rem; color: #27ae60; }
        nav ul { list-style: none; }
        nav li { padding: 1rem 0; border-bottom: 1px solid #34495e; cursor: pointer; }
        nav li:hover { color: #27ae60; }

        /* Conteúdo Central */
        main { flex: 1; padding: 2rem; }
        .header-main { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .feed { display: grid; gap: 1.5rem; }
        .card { background: white; padding: 1.5rem; border-radius: 8px; shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* Coluna de Propaganda (Sustentabilidade) */
        .ads-column { width: 300px; padding: 2rem; background: #fff; border-left: 1px solid #ddd; }
        .ad-space { width: 100%; height: 250px; background: #eee; border: 2px dashed #bbb; display: flex; 
                    align-items: center; justify-content: center; text-align: center; color: #888; border-radius: 8px; }
    </style>
</head>
<body>
    <nav>
        <h1>Lara Pet</h1>
        <ul>
            <li>🐾 Início</li>
            <li>💊 Medicamentos</li>
            <li>🧸 Acessórios</li>
            <li>🔍 Pets Perdidos</li>
            <li>🚪 Sair</li>
        </ul>
    </nav>

    <main>
        <div class="header-main">
            <h2>Bem-vindo à Farmacura</h2>
            <button style="padding: 0.5rem 1rem; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer;">
                + Nova Doação/Pedido
            </button>
        </div>

        <div class="feed" id="feedConteudo">
            <div class="card">
                <h3>Carregando doações...</h3>
            </div>
        </div>
    </main>

    <aside class="ads-column">
        <h4>Parceiros Solidários</h4>
        <p style="font-size: 0.8rem; color: #999; margin-bottom: 1rem;">Espaço Publicitário</p>
        <div class="ad-space">
            Anuncie aqui sua PetShop<br>Ajude a causa animal
        </div>
    </aside>

    <script type="module" src="../js/dashboard.js"></script>
</body>
</html>
